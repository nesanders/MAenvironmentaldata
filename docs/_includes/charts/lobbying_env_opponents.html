{% raw  %}
<html>
    <head>
        <title>Top 20 Clients Opposing Environmental Bills (all years)</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 750px; height: 520px; max-width: 99%" class="chartjs">

            <canvas id="Top 20 Clients Opposing Environmental Bills (all years)" height="520" width="750"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["Personal Care Products Council", "Wheelabrator Environmental Systems, Inc.", "Sunbeam Products, Inc.", "Environmental League of Massachusetts Action Fund", "National Grid", "Environmental League of Massachusetts", "Massachusetts Hospital Association", "American Forest & Paper Association, Inc.", "Associated Builders and Contractors, MA Chapter", "Massachusetts Insurance Federation, Inc.", "Consumer Technology Association", "Massachusetts Property Insurance Underwriting Association", "Eastman Chemical Company", "Flint Hills Resources, Limited Partnership", "NAIOP Massachusetts", "Georgia-Pacific Limited Liability Company", "Massachusetts Municipal Association", "Retailers Association of Massachusetts", "Mass Audubon", "American Chemistry Council"],
                        datasets: [{'data': [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 4, 4, 4, 4, 5, 6, 6, 9], 'label': 'Unique env bills opposed', 'backgroundColor': 'rgba(200, 60, 60, 0.85)'}]
                    },
                    type: 'bar',
                    options: {
                        indexAxis: 'y',
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Unique environmental bills opposed'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Top 20 Clients Opposing Environmental Bills (all years)").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
