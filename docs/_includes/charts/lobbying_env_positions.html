{% raw  %}
<html>
    <head>
        <title>Unique Clients by Position on Environmental Bills</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="Unique Clients by Position on Environmental Bills" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"],
                        datasets: [{'data': [3.0, 8.0, 7.0, 14.0, 56.0, 78.0, 66.0, 68.0, 86.0, 52.0, 40.0, 48.0, 66.0, 35.0, 67.0, 65.0], 'label': 'Support', 'backgroundColor': 'rgba(60, 170, 80, 0.85)', 'stack': 'pos'},{'data': [6.0, 12.0, 15.0, 16.0, 83.0, 87.0, 88.0, 64.0, 69.0, 62.0, 71.0, 99.0, 125.0, 77.0, 156.0, 131.0], 'label': 'Neutral', 'backgroundColor': 'rgba(150, 150, 150, 0.6)', 'stack': 'pos'},{'data': [6.0, 9.0, 12.0, 15.0, 92.0, 87.0, 59.0, 54.0, 61.0, 52.0, 22.0, 42.0, 52.0, 39.0, 60.0, 56.0], 'label': 'Oppose', 'backgroundColor': 'rgba(200, 60, 60, 0.85)', 'stack': 'pos'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Unique lobbying clients'
                                },
                                position: 'left',
                                stacked: true
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Unique Clients by Position on Environmental Bills").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
