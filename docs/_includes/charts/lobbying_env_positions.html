{% raw  %}
<html>
    <head>
        <title>Unique Clients by Position on Environmental Bills</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="Unique Clients by Position on Environmental Bills" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2010", "2011", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"],
                        datasets: [{'data': [2.0, 4.0, 3.0, 12.0, 27.0, 25.0, 24.0, 12.0, 13.0, 10.0, 17.0, 24.0, 13.0, 33.0, 43.0], 'label': 'Support', 'backgroundColor': 'rgba(60, 170, 80, 0.85)', 'stack': 'pos'},{'data': [2.0, 1.0, 0.0, 19.0, 22.0, 11.0, 11.0, 5.0, 20.0, 27.0, 38.0, 63.0, 14.0, 53.0, 114.0], 'label': 'Neutral', 'backgroundColor': 'rgba(150, 150, 150, 0.6)', 'stack': 'pos'},{'data': [2.0, 0.0, 5.0, 60.0, 26.0, 25.0, 23.0, 12.0, 17.0, 2.0, 7.0, 12.0, 12.0, 21.0, 31.0], 'label': 'Oppose', 'backgroundColor': 'rgba(200, 60, 60, 0.85)', 'stack': 'pos'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Unique lobbying clients'
                                },
                                position: 'left',
                                stacked: true
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Unique Clients by Position on Environmental Bills").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
