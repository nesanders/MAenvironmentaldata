<html>

            <canvas id="MS4 Stormwater System Mapping Completion by Report Year" height="380" width="700"></canvas>

                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {

                        datasets: [{'data': [0.0, 0.0, 8.440000000000014, 10.800000000000004, 20.8, 0.0, 30.0, 0.0], 'label': 'p10', 'borderColor': 'rgba(200,60,60,0.3)', 'backgroundColor': 'rgba(200,60,60,0.3)', 'fill': false, 'tension': 0.3},{'data': [13.75, 1.25, 73.0, 54.0, 52.0, 50.0, 60.0, 0.0], 'label': 'p25', 'borderColor': 'rgba(230,140,40,0.5)', 'backgroundColor': 'rgba(230,140,40,0.5)', 'fill': false, 'tension': 0.3},{'data': [90.0, 90.0, 100.0, 98.65, 99.0, 80.0, 90.0, 0.0], 'label': 'Median', 'borderColor': 'rgba(54, 110, 179, 0.85)', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'fill': false, 'tension': 0.3},{'data': [100.0, 100.0, 100.0, 100.0, 100.0, 97.0, 99.0, 0.0], 'label': 'p75', 'borderColor': 'rgba(230,140,40,0.5)', 'backgroundColor': 'rgba(230,140,40,0.5)', 'fill': false, 'tension': 0.3},{'data': [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 0.0], 'label': 'p90', 'borderColor': 'rgba(200,60,60,0.3)', 'backgroundColor': 'rgba(200,60,60,0.3)', 'fill': false, 'tension': 0.3}]
                    },
                    type: 'line',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Mapping Completion (%)'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Report Year (FY)'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("MS4 Stormwater System Mapping Completion by Report Year").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
