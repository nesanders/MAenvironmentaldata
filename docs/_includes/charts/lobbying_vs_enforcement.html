{% raw  %}
<html>
    <head>
        <title>MA Lobbying Spend vs. Enforcement Actions</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="MA Lobbying Spend vs. Enforcement Actions" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2019", "2020", "2021", "2022", "2023", "2024", "2025"],
                        datasets: [{'data': [0.8002561536459628, 1.5619733287201554, 0.990592465907141, 1.653414212672624, 1.0991023039329253, 1.4808319346725463, 0.6316070985548178], 'label': 'Lobbying spend ($M)', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'yAxisID': 'y'},{'data': [369, 233, 369, 319, 314, 339, 340], 'label': 'Enforcement actions', 'backgroundColor': 'rgba(200, 60, 60, 0.85)', 'type': 'line', 'yAxisID': 'y1'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Lobbying spend ($M)'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Enforcement actions'
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("MA Lobbying Spend vs. Enforcement Actions").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
