{% raw  %}
<html>
    <head>
        <title>Environmental Bills Lobbied per Year</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="Environmental Bills Lobbied per Year" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"],
                        datasets: [{'data': [2, 12, 10, 9, 16, 31, 34, 32, 28, 27, 31, 18, 28, 32, 41, 51, 47], 'label': 'Unique bills lobbied', 'backgroundColor': 'rgba(30, 160, 160, 0.85)', 'yAxisID': 'y'},{'data': [0.0, 0.0, 33.33333333333333, 50.0, 0.0, 0.0, 0.0, 3.3333333333333335, 3.571428571428571, 3.8461538461538463, 3.3333333333333335, 0.0, 0.0, 10.0, 0.0, 2.0, 6.382978723404255], 'label': 'Pass rate (%)', 'backgroundColor': 'rgba(60, 170, 80, 0.85)', 'type': 'line', 'yAxisID': 'y1'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Bills lobbied'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Pass rate (%)'
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Environmental Bills Lobbied per Year").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
