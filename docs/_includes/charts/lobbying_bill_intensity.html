{% raw  %}
<html>
    <head>
        <title>Environmental Bills Lobbied per Year</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="Environmental Bills Lobbied per Year" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2009", "2024"],
                        datasets: [{'data': [15, 587], 'label': 'Unique bills lobbied', 'backgroundColor': 'rgba(30, 160, 160, 0.85)', 'yAxisID': 'y'},{'data': [0.0, 4.436860068259386], 'label': 'Pass rate (%)', 'backgroundColor': 'rgba(60, 170, 80, 0.85)', 'type': 'line', 'yAxisID': 'y1'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Bills lobbied'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Pass rate (%)'
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Environmental Bills Lobbied per Year").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
