{% raw  %}
<html>
    <head>
        <title>Top Impairment Causes Across Reporting Cycles</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@2.8.0/dist/Chart.bundle.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 440px; max-width: 99%" class="chartjs">

            <canvas id="Top Impairment Causes Across Reporting Cycles" height="440" width="700"></canvas>
            <script>
                Chart.defaults.global.defaultFontSize = 12;
                var chart_data = {
                
                    data: {
                        labels: ['2010', '2012', '2014', '2016', '2018', '2022'],
                        datasets: [{'data': [396.0, 376.0, 376.0, 344.0, 344.0, 355.0], 'label': 'Fecal Coliform', 'borderColor': 'rgba(200, 60, 60, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [0.0, 0.0, 0.0, 292.0, 296.0, 324.0], 'label': 'Escherichia Coli (E. Coli)', 'borderColor': 'rgba(54, 110, 179, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [0.0, 0.0, 0.0, 207.0, 237.0, 273.0], 'label': 'Dissolved Oxygen', 'borderColor': 'rgba(60, 170, 80, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [341.0, 357.0, 357.0, 358.0, 248.0, 231.0], 'label': 'Non-Native Aquatic Plants', 'borderColor': 'rgba(230, 140, 40, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [158.0, 178.0, 181.0, 179.0, 192.0, 204.0], 'label': 'Mercury In Fish Tissue', 'borderColor': 'rgba(130, 80, 200, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [75.0, 80.0, 85.0, 121.0, 160.0, 181.0], 'label': 'Nutrient/Eutrophication Biological Indicators', 'borderColor': 'rgba(30, 160, 160, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [0.0, 0.0, 0.0, 0.0, 150.0, 173.0], 'label': 'Fanwort', 'borderColor': 'rgba(180, 100, 50, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4},{'data': [0.0, 0.0, 0.0, 18.0, 112.0, 140.0], 'label': 'Fish Passage Barrier', 'borderColor': 'rgba(220, 80, 180, 0.9)', 'backgroundColor': 'rgba(0,0,0,0)', 'fill': false, 'pointRadius': 4}]
                    },
                    type: 'line',
                    options: {
                        scales: {
                            yAxes: [{
                                display: true,
                                scaleLabel: {
                                    display: true,
                                    labelString: 'Impaired assessment units (distinct)'
                                },
                                ticks: {
                                    beginAtZero: true, min: 0
                                },
                                "id": "y-axis-0",
                                "position": "left",
                                stacked: false
                            }, {
                                display: false,
                                scaleLabel: {
                                    display: true,
                                    labelString: ''
                                },
                                ticks: {
                                    beginAtZero: true, min: 0
                                },
                                "id": "y-axis-1",
                                "position": "right"
                            }],
                            xAxes: [{
                                scaleLabel: {
                                    display: true,
                                    labelString: 'Reporting cycle'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }]
                        },
                        legend: {
                            display: true
                            },
                        tooltips: {
                            display: true
                            }
                    },
                }
                
                
                
            </script>
            <script>
                {{
                    var ctx = document.getElementById("Top Impairment Causes Across Reporting Cycles").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }}
            </script>

        </div>
    </body>
</html>
{% endraw  %}
