{% raw  %}
<html>
    <head>
        <title>CSO Discharge Volume by 303(d) Impairment Status</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 420px; max-width: 99%" class="chartjs">

            <canvas id="CSO Discharge Volume by 303(d) Impairment Status" height="420" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2022", "2023", "2024", "2025", "2026"],
                        datasets: [{'data': [1.34795057, 5.640314606, 5.52247017, 2.650116922, 0.863110167], 'label': 'Confirmed impaired (Not Supporting)', 'backgroundColor': 'rgba(200, 60, 60, 0.85)', 'stack': 'status'},{'data': [0.094354352, 1.605779248, 2.145504412, 0.420871658, 0.149677967], 'label': 'Status unknown (no 303d match)', 'backgroundColor': 'rgba(150, 150, 150, 0.6)', 'stack': 'status'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Discharge volume (billion gallons)'
                                },
                            beginAtZero: true,
                                position: 'left',
                                stacked: true
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("CSO Discharge Volume by 303(d) Impairment Status").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
