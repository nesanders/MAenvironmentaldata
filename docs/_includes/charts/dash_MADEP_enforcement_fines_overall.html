{% raw  %}
<html>
    <head>
        <title>Overall DEP Enforcement Penalties ($M)</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 640px; height: 480px; max-width: 99%" class="chartjs">

            <canvas id="Overall DEP Enforcement Penalties ($M)" height="480" width="640"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026"],
                        datasets: [{'data': [3.11446, 1.826646, 1.938032, 2.62953, 4.837296, 3.59366, 2.889449, 2.110374, 2.301807, 2.109543, 1.786811, 1.337741, 1.368937, 1.900576, 0.902028, 0.706457, 1.193786, 0.953871, 0.969549, 0.683028, 1.672336, 1.053674, 1.035999, 1.300763, 1.419162, 0.612079], 'label': 'Reported penalties', 'backgroundColor': 'rgba(50,50,200,0.8)', 'stack': 'annual', 'yAxisID': 'y'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Sum of reported penalties ($M)'
                                },
                            beginAtZero: true,
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Overall DEP Enforcement Penalties ($M)").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
