{% raw  %}
<html>
    <head>
        <title>MA Lobbying Spend vs. DEP Budget (inflation-adjusted)</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 400px; max-width: 99%" class="chartjs">

            <canvas id="MA Lobbying Spend vs. DEP Budget (inflation-adjusted)" height="400" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2019", "2020", "2021", "2022", "2023", "2024", "2025"],
                        datasets: [{'data': [0.876161587751646, 1.5702343887928827, 1.0554689168838394, 1.775705854602587, 1.428407673365513, 1.7426484481053597, 0.7236199679872644], 'label': 'Industry lobbying spend ($M)', 'backgroundColor': 'rgba(230, 140, 40, 0.85)', 'yAxisID': 'y'},{'data': [37.60870536390118, 40.28206302422945, 46.254922289813294, 36.60585418435639, 47.59754731934593, 52.038191, null], 'label': 'DEP admin budget ($M, inflation-adj.)', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'type': 'line', 'yAxisID': 'y1'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Lobbying spend ($M)'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'DEP budget ($M)'
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("MA Lobbying Spend vs. DEP Budget (inflation-adjusted)").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
