{% raw  %}
<html>
    <head>
        <title>MS4 MCM Participation Rate by Report Year (% of Municipalities Reporting Activity)</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="MS4 MCM Participation Rate by Report Year (% of Municipalities Reporting Activity)" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026 (partial)"],
                        datasets: [{'data': [20.1, 22.6, 34.2, 28.0, 17.8, 17.2, 23.7, 0.0], 'label': 'MCM3 Outfall Screening', 'borderColor': 'rgba(230, 140, 40, 0.85)', 'backgroundColor': 'rgba(230, 140, 40, 0.85)', 'fill': false, 'tension': 0.3},{'data': [73.4, 77.0, 77.0, 75.0, 81.3, 80.0, 79.0, 0.0], 'label': 'MCM4 Construction Inspections', 'borderColor': 'rgba(54, 110, 179, 0.85)', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'fill': false, 'tension': 0.3},{'data': [89.5, 95.8, 96.3, 98.3, 96.0, 95.8, 99.5, 100.0], 'label': 'MCM6 Facility Inspections', 'borderColor': 'rgba(60, 170, 80, 0.85)', 'backgroundColor': 'rgba(60, 170, 80, 0.85)', 'fill': false, 'tension': 0.3}]
                    },
                    type: 'line',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: '% of Municipalities with Non-Zero Activity'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Report Year (FY)'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("MS4 MCM Participation Rate by Report Year (% of Municipalities Reporting Activity)").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
