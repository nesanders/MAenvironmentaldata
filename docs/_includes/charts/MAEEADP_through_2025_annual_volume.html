{% raw  %}
<html>
    <head>
        <title>Annual CSO discharge volume</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 640px; height: 400px; max-width: 99%" class="chartjs">

            <canvas id="Annual CSO discharge volume" height="400" width="640"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2022*", "2023", "2024", "2025"],
                        datasets: [{'data': [1442.304922, 7245.363624, 7667.293701, 3070.98858], 'label': 'Total discharge volume (M gallons)', 'backgroundColor': 'rgba(31, 119, 180,0.8)', 'yAxisID': 'y'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Total discharge volume (millions of gallons)'
                                },
                            beginAtZero: true,
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Calendar year  (* 2022 reporting began June 30)'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Annual CSO discharge volume").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
