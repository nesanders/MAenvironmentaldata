{% raw  %}
<html>
    <head>
        <title>MCM3 Outfall Screening Rate by Year (Municipalities Reporting Both Total and Screened)</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="MCM3 Outfall Screening Rate by Year (Municipalities Reporting Both Total and Screened)" height="380" width="700"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026 (partial)"],
                        datasets: [{'data': [25.0, 0.0, 14.6, 7.6, 0.0, 0.0, 0.1, null], 'label': 'p25', 'borderColor': 'rgba(150, 150, 150, 0.6)', 'backgroundColor': 'rgba(150, 150, 150, 0.6)', 'fill': false, 'tension': 0.3, 'pointRadius': 2},{'data': [63.0, 2.9, 55.2, 71.5, 13.1, 1.7, 7.4, null], 'label': 'Median', 'borderColor': 'rgba(54, 110, 179, 0.85)', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'fill': false, 'tension': 0.3, 'pointRadius': 5, 'borderWidth': 3},{'data': [100.0, 43.5, 99.8, 100.0, 100.0, 17.9, 92.3, null], 'label': 'p75', 'borderColor': 'rgba(150, 150, 150, 0.6)', 'backgroundColor': 'rgba(150, 150, 150, 0.6)', 'fill': false, 'tension': 0.3, 'pointRadius': 2}]
                    },
                    type: 'line',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Outfalls Screened / Total (%)'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Report Year (FY)'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("MCM3 Outfall Screening Rate by Year (Municipalities Reporting Both Total and Screened)").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
