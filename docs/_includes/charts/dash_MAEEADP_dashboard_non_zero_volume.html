            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2022", "2023", "2024", "2025", "2026"],
                        datasets: [{'data': [48.883374689826304, 45.988740323715696, 37.41188318227593, 42.29249011857708, 25.649350649350648], 'label': 'CSO – Untreated', 'borderColor': 'rgba(31, 119, 180,0.9)', 'backgroundColor': 'rgba(31, 119, 180,0.1)', 'pointRadius': 4, 'fill': false, 'borderWidth': 2, 'spanGaps': true},{'data': [90.9090909090909, 99.19028340080972, 97.32620320855615, 98.70967741935483, 100.0], 'label': 'CSO – Treated', 'borderColor': 'rgba(255, 127, 14,0.9)', 'backgroundColor': 'rgba(255, 127, 14,0.1)', 'pointRadius': 4, 'fill': false, 'borderWidth': 2, 'spanGaps': true},{'data': [95.16129032258065, 95.28795811518324, 82.14285714285714, 81.20805369127517, 79.48717948717949], 'label': 'Partially Treated', 'borderColor': 'rgba(44, 160, 44,0.9)', 'backgroundColor': 'rgba(44, 160, 44,0.1)', 'pointRadius': 4, 'fill': false, 'borderWidth': 2, 'spanGaps': true},{'data': [66.66666666666666, 37.89473684210527, 46.875, 35.294117647058826, 57.14285714285714], 'label': 'SSO', 'borderColor': 'rgba(214, 39, 40,0.9)', 'backgroundColor': 'rgba(214, 39, 40,0.1)', 'pointRadius': 4, 'fill': false, 'borderWidth': 2, 'spanGaps': true}]

                    type: 'line',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Reports with likely-modeled volume (%)'
                                },
                            beginAtZero: true,
                            min: 0,
                            max: 100,
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Fraction of reports with likely-modeled volume estimates, by type and year").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
