{% raw  %}
<html>
    <head>
        <title>Total Lobbying Spend by Known CSO Operators</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 750px; height: 420px; max-width: 99%" class="chartjs">

            <canvas id="Total Lobbying Spend by Known CSO Operators" height="420" width="750"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2024", "2025"],
                        datasets: [{'data': [0.01, 0.015], 'label': 'SPRINGFIELD WATER & SEWER COMMISSION', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'stack': 'a'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Annual lobbying spend ($M)'
                                },
                                position: 'left',
                                stacked: true
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Total Lobbying Spend by Known CSO Operators").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
