{% raw  %}
<html>
    <head>
        <title>Annual CSO discharge count</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 640px; height: 400px; max-width: 99%" class="chartjs">

            <canvas id="Annual CSO discharge count" height="400" width="640"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["2022*", "2023", "2024", "2025", "2026"],
                        datasets: [{'data': [1362, 3375, 2405, 1839, 371], 'label': 'Number of discharge reports', 'backgroundColor': 'rgba(44, 160, 44,0.8)', 'yAxisID': 'y'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Number of discharge reports'
                                },
                            beginAtZero: true,
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Calendar year  (* 2022 reporting began June 30)'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Annual CSO discharge count").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
