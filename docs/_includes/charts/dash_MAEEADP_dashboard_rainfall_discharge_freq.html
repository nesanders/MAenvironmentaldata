{% raw  %}
<html>
    <head>
        <title>Fraction of days with any discharge by prior-48-hr rainfall</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 640px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="Fraction of days with any discharge by prior-48-hr rainfall" height="380" width="640"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["None (<0.05 in)", "Light (0.05\u20130.25 in)", "Moderate (0.25\u20130.75 in)", "Heavy (0.75\u20131.5 in)", "Very heavy (>1.5 in)"],
                        datasets: [{'data': [30.718954248366014, 38.4393063583815, 36.55172413793103, 33.088235294117645, 27.77777777777778], 'label': 'CSO – Untreated', 'backgroundColor': 'rgba(31, 119, 180,0.75)', 'borderColor': 'rgba(31, 119, 180,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [0.49019607843137253, 0.2890173410404624, 0.3448275862068966, 0.7352941176470588, 0.0], 'label': 'CSO – Treated', 'backgroundColor': 'rgba(255, 127, 14,0.75)', 'borderColor': 'rgba(255, 127, 14,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [1.6339869281045754, 2.023121387283237, 2.0689655172413794, 5.88235294117647, 5.555555555555555], 'label': 'Partially Treated', 'backgroundColor': 'rgba(44, 160, 44,0.75)', 'borderColor': 'rgba(44, 160, 44,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [1.3071895424836601, 1.1560693641618496, 2.0689655172413794, 2.941176470588235, 5.555555555555555], 'label': 'SSO', 'backgroundColor': 'rgba(214, 39, 40,0.75)', 'borderColor': 'rgba(214, 39, 40,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [612, 346, 290, 136, 36], 'label': 'Days in bin', 'type': 'line', 'yAxisID': 'y1', 'backgroundColor': 'rgba(148, 103, 189,0.15)', 'borderColor': 'rgba(148, 103, 189,0.7)', 'pointBackgroundColor': 'rgba(148, 103, 189,0.9)', 'pointRadius': 4, 'fill': false}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Days with discharge reported (%)'
                                },
                            beginAtZero: true,
                                position: 'left',
                                stacked: true
                            },
                            y1: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Number of days in bin'
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Prior 48-hr precipitation (MA station avg)'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                

chart_data.options.plugins.tooltip = { callbacks: { label: function(context) { if (context.datasetIndex < 4) {  return context.dataset.label + ": " + context.parsed.y.toFixed(1) + "% of days"; } else {  return context.parsed.y.toFixed(0) + " days in bin"; }} } };
            </script>
            <script>
                {

                    var ctx = document.getElementById("Fraction of days with any discharge by prior-48-hr rainfall").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
