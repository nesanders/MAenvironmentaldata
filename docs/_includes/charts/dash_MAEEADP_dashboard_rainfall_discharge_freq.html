{% raw  %}
<html>
    <head>
        <title>Fraction of days with any discharge by prior-48-hr rainfall</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 640px; height: 380px; max-width: 99%" class="chartjs">

            <canvas id="Fraction of days with any discharge by prior-48-hr rainfall" height="380" width="640"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["None (<0.05 in)", "Light (0.05\u20130.25 in)", "Moderate (0.25\u20130.75 in)", "Heavy (0.75\u20131.5 in)", "Very heavy (>1.5 in)"],
                        datasets: [{'data': [6.230529595015576, 30.319148936170215, 57.51633986928104, 82.3943661971831, 94.5945945945946], 'label': 'CSO – Untreated', 'backgroundColor': 'rgba(31, 119, 180,0.75)', 'borderColor': 'rgba(31, 119, 180,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [0.46728971962616817, 0.26595744680851063, 0.6535947712418301, 0.0, 0.0], 'label': 'CSO – Treated', 'backgroundColor': 'rgba(255, 127, 14,0.75)', 'borderColor': 'rgba(255, 127, 14,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [2.1806853582554515, 2.6595744680851063, 2.6143790849673203, 0.0, 2.7027027027027026], 'label': 'Partially Treated', 'backgroundColor': 'rgba(44, 160, 44,0.75)', 'borderColor': 'rgba(44, 160, 44,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [2.4922118380062304, 0.7978723404255319, 0.9803921568627451, 1.4084507042253522, 0.0], 'label': 'SSO', 'backgroundColor': 'rgba(214, 39, 40,0.75)', 'borderColor': 'rgba(214, 39, 40,1.0)', 'borderWidth': 1, 'yAxisID': 'y', 'stack': 'discharge'},{'data': [642, 376, 306, 142, 37], 'label': 'Days in bin', 'type': 'line', 'yAxisID': 'y1', 'backgroundColor': 'rgba(148, 103, 189,0.15)', 'borderColor': 'rgba(148, 103, 189,0.7)', 'pointBackgroundColor': 'rgba(148, 103, 189,0.9)', 'pointRadius': 4, 'fill': false}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Days with discharge reported (%)'
                                },
                            beginAtZero: true,
                                position: 'left',
                                stacked: true
                            },
                            y1: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Number of days in bin'
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Prior 48-hr precipitation (MA station avg)'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                

chart_data.options.plugins.tooltip = { callbacks: { label: function(context) { if (context.datasetIndex < 4) {  return context.dataset.label + ": " + context.parsed.y.toFixed(1) + "% of days"; } else {  return context.parsed.y.toFixed(0) + " days in bin"; }} } };
            </script>
            <script>
                {

                    var ctx = document.getElementById("Fraction of days with any discharge by prior-48-hr rainfall").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
