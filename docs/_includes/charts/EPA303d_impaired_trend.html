{% raw  %}
<html>
    <head>
        <title>MA 303(d) Impaired Waters by Type</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@2.8.0/dist/Chart.bundle.min.js'></script>
    </head>
    <body>
        <div style="width: 700px; height: 420px; max-width: 99%" class="chartjs">

            <canvas id="MA 303(d) Impaired Waters by Type" height="420" width="700"></canvas>
            <script>
                Chart.defaults.global.defaultFontSize = 12;
                var chart_data = {
                
                    data: {
                        labels: ['2010', '2012', '2014', '2016', '2018', '2022'],
                        datasets: [{'data': [366.0, 383.0, 384.0, 489.0, 565.0, 620.0], 'label': 'River', 'backgroundColor': 'rgba(54, 110, 179, 0.85)', 'stack': 'type'},{'data': [573.0, 591.0, 592.0, 588.0, 630.0, 648.0], 'label': 'Freshwater Lake', 'backgroundColor': 'rgba(60, 170, 80, 0.85)', 'stack': 'type'},{'data': [239.0, 257.0, 258.0, 261.0, 280.0, 296.0], 'label': 'Estuary', 'backgroundColor': 'rgba(230, 140, 40, 0.85)', 'stack': 'type'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            yAxes: [{
                                display: true,
                                scaleLabel: {
                                    display: true,
                                    labelString: 'Impaired assessment units (distinct)'
                                },
                                ticks: {
                                    beginAtZero: true, min: 0
                                },
                                "id": "y-axis-0",
                                "position": "left",
                                stacked: true
                            }, {
                                display: false,
                                scaleLabel: {
                                    display: true,
                                    labelString: ''
                                },
                                ticks: {
                                    beginAtZero: true, min: 0
                                },
                                "id": "y-axis-1",
                                "position": "right"
                            }],
                            xAxes: [{
                                scaleLabel: {
                                    display: true,
                                    labelString: 'Reporting cycle'
                                },
                                stacked: true,
                                ticks: {
                                    autoSkip: true
                                }
                            }]
                        },
                        legend: {
                            display: true
                            },
                        tooltips: {
                            display: true
                            }
                    },
                }
                
                
                
            </script>
            <script>
                {{
                    var ctx = document.getElementById("MA 303(d) Impaired Waters by Type").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }}
            </script>

        </div>
    </body>
</html>
{% endraw  %}
