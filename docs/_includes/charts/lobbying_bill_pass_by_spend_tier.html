{% raw  %}
<html>
    <head>
        <title>Environmental Bill Pass Rate by Lobbying Intensity</title>
        <script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script>
    </head>
    <body>
        <div style="width: 500px; height: 360px; max-width: 99%" class="chartjs">

            <canvas id="Environmental Bill Pass Rate by Lobbying Intensity" height="360" width="500"></canvas>
            <script>
                Chart.defaults.font.size = 12;
                var chart_data = {

                    data: {
                        labels: ["1\u20132 clients", "3\u20139 clients", "10+ clients"],
                        datasets: [{'data': [2.564102564102564, 7.8125, 15.384615384615385], 'label': 'Pass rate (%)', 'backgroundColor': 'rgba(60, 170, 80, 0.85)'}]
                    },
                    type: 'bar',
                    options: {
                        scales: {
                            y: {
                                display: true,
                                title: {
                                    display: true,
                                    text: 'Pass rate (%)'
                                },
                                position: 'left',
                                stacked: false
                            },
                            y1: {
                                display: false,
                                title: {
                                    display: true,
                                    text: ''
                                },
                                position: 'right'
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Number of employer lobbiers'
                                },
                                stacked: false,
                                ticks: {
                                    autoSkip: true
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                }
                
                
            </script>
            <script>
                {

                    var ctx = document.getElementById("Environmental Bill Pass Rate by Lobbying Intensity").getContext("2d");
                    var mychart = new Chart(ctx, chart_data);
                }
            </script>
        </div>
    </body>
</html>
{% endraw  %}
