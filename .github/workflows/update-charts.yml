name: Update Charts

on:
  workflow_run:
    workflows: ["Update Data"]
    types: [completed]
  workflow_dispatch:       # Allow manual trigger from GitHub UI

concurrency:
  group: update-charts
  cancel-in-progress: false

jobs:
  update-charts:
    # Only run if the Update Data workflow succeeded (or manual dispatch)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit updated charts
      issues: write     # to open failure issues

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Generate dashboard charts
        working-directory: analysis
        run: python dashboard_charts.py

      - name: Write dashboard update timestamp
        run: |
          echo "updated: $(date -u +'%Y-%m-%d %H:%M:%S')" > docs/data/ts_update_dashboard.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_includes/charts/dash_*.html docs/data/facts_dash_*.yml docs/data/facts_DEPstaff.yml docs/data/facts_DEPenforce.yml docs/data/facts_ECOSbudgets.yml docs/data/ts_update_dashboard.yml
          git diff --staged --quiet \
            || git commit -m "Auto-update dashboard charts $(date -u +%Y-%m-%d)" \
            && git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Chart update failed: ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## Chart generation failed',
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check the run logs above for details.',
                '',
                'Note: NECIR_CSO_map.py (PySTAN regression) is intentionally excluded from CI — run it locally.',
              ].join('\n'),
              labels: ['chart-update-failure'],
            })
