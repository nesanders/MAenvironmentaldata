name: Tests

on:
  push:
  pull_request:
    paths:
      - 'docs/assets/db_semantic_context.txt'
      - 'tests/eval_fixtures.yaml'
      - 'get_data/generate_semantic_context.py'
      - 'tests/test_semantic_evals.py'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fast:
    name: Syntax + data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run fast tests
        run: pytest tests/test_syntax.py tests/test_data_integrity.py -v

  db-assembly:
    name: DB assembly
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Build AMEND.db (no upload)
        working-directory: get_data
        run: python assemble_db.py --no-upload

      - name: Run DB assembly tests
        run: pytest tests/test_db_assembly.py -v

  evals:
    name: Semantic evals
    # path filter on the trigger (above) ensures this only runs on pull_request events
    # touching files that affect SQL generation — avoids burning free-tier quota on every push.
    if: github.event_name == 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    continue-on-error: true  # remove once baseline pass rate is established
    permissions:
      models: read
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install eval dependencies
        run: pip install openai pytest pyyaml

      - name: Download AMEND.db from GCS
        run: |
          curl -sL "https://storage.googleapis.com/openamend-data/amend.db" \
               -o get_data/AMEND.db
          echo "DB size: $(du -sh get_data/AMEND.db | cut -f1)"

      - name: Run semantic evals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pytest tests/test_semantic_evals.py -v --tb=short

      - name: Post eval summary as PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: python tests/post_eval_comment.py

      - name: Commit eval summary to main
        if: github.ref == 'refs/heads/main' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/eval_results/summary.json
          git diff --staged --quiet || (git commit -m "Update eval summary [skip ci]" && git push)
